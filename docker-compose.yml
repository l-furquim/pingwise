services:
  postgres:
    image: postgres:16.10
    container_name: pingwise-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pingwise
    restart: unless-stopped
    shm_size: 128mb

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: pingwise-rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    image: redis:8.8-m03-alpine3.23
    container_name: pingwise-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis --appendonly yes
    volumes:
      - redis_data:/data
volumes:
  postgres-data:
  rabbitmq_data:
  redis_data:
