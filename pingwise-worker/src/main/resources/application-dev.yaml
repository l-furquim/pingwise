server:
  port: 8081
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit
  datasource:
    url: jdbc:postgresql://localhost:5432/pingwise
    username: postgres
    password: postgres
rabbit:
  checks:
    queue: "pingwise.check.queue"
  monitor:
    update:
      exchange: "pingwise.monitor.update.exchange"
      routing: "pingwise.monitor.update.routing"
